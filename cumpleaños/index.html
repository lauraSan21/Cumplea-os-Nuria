<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Cumple</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="auth-wrap">
    <section class="card">
      <p id="bootLine" class="boot-line"></p>
      <p class="brand-line">&gt; BirthdayOS <span id="systemVersion"></span></p>
      <p class="subtitle">secure birthday terminal</p>

      <form id="loginForm" class="form" autocomplete="off">
        <label for="username">Usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="_"
          required
        />

        <label for="password">Contrasena</label>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            type="password"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="_"
            required
          />
          <button
            id="togglePasswordBtn"
            class="toggle-btn"
            type="button"
            aria-label="Mostrar contrasena"
            title="Mostrar contrasena"
          >
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="icon-slash" d="M4 20L20 4"></path>
            </svg>
          </button>
        </div>
        <button id="loginBtn" type="submit">acceder</button>
      </form>

      <button id="forgotBtn" type="button" class="forgot-btn">Olvidaste tu contrasena?</button>
      <p id="forgotHint" class="forgot-hint" aria-live="polite"></p>
      <p id="statusLine" class="status-line" aria-live="polite"></p>
      <p id="message" class="message" aria-live="polite"></p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
