<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz cumple 2028</title>
  <style>
    :root {
      --bg-a: #fff7f0;
      --bg-b: #ffd8c4;
      --ink: #2f2a25;
      --tag: #b84f2d;
      --panel: rgba(255, 255, 255, 0.9);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, #ffffff 0%, transparent 33%),
        radial-gradient(circle at 85% 80%, #ffc2a3 0%, transparent 28%),
        linear-gradient(135deg, var(--bg-a), var(--bg-b));
      padding: 1.2rem;
    }
    .panel {
      width: min(760px, 100%);
      background: var(--panel);
      border-radius: 22px;
      padding: clamp(1.2rem, 3vw, 2rem);
      box-shadow: 0 18px 38px rgba(77, 54, 39, 0.2);
    }
    .version {
      margin: 0;
      display: inline-block;
      background: #ffe5d7;
      color: var(--tag);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    h1 {
      margin: 0.8rem 0 0.5rem;
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
    }
    .age {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .text {
      margin-top: 1.1rem;
      line-height: 1.6;
      font-size: 1.05rem;
    }
    .back {
      margin-top: 1.35rem;
      display: inline-block;
      font-weight: 700;
      color: #7d3b25;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="panel">
    <p class="version" id="versionLabel">Version 2.6</p>
    <h1>Feliz cumple 2028</h1>
    <p class="age" id="ageLabel">Build de edad: 26 anos</p>
    <p class="text">
      Seguimos sumando anos, historias y abrazos.
      Version <span id="inlineVersion">2.6</span> lista para otra etapa preciosa.
    </p>
    <a class="back" href="../index.html">Volver al login</a>
  </main>
  <script>
    const BIRTH_YEAR = 2002;
    const PAGE_YEAR = 2028;
    const age = PAGE_YEAR - BIRTH_YEAR;
    const version = `${Math.floor(age / 10)}.${age % 10}`;
    document.getElementById("versionLabel").textContent = `Version ${version}`;
    document.getElementById("ageLabel").textContent = `Build de edad: ${age} anos`;
    document.getElementById("inlineVersion").textContent = version;
  </script>
</body>
</html>
